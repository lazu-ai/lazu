data:
  # Root data directory
  dir: ./data
  # Application log subdirectory, relative to data.dir
  logs_subdir: logs
  # Export (JSONL) subdirectory, relative to data.dir
  export_subdir: export

database:
  # PostgreSQL connection URL. DATABASE_URL env has priority.
  url: "${DATABASE_URL}"

root:
  # Optional root account bootstrap. When both are set, startup upserts the root user.
  username: "${ROOT_USERNAME}"
  password: "${ROOT_PASSWORD}"

payment:
  stripe:
    # All Stripe identifiers (including price_id) come from .env so the
    # YAML never carries account-specific values. Browser and API origins
    # are architectural URLs, not Stripe identifiers.
    secret_key: "${STRIPE_SECRET_KEY}"
    webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
    price_id: "${STRIPE_PRICE_ID}"
    server_address: "http://localhost:3000"
    # Browser destination for Checkout and billing-portal returns. Use the
    # console origin when it differs from the API origin.
    return_base: ""
    promotion_codes_enabled: false

# Data retention policy (defaults)
# - Database log tables (logs / log_insights / quota_data): 30 days
#   LOG_RETENTION_DAYS: default 90 in production (minimum 30, the model ranking window); <=0 disables cleanup
# - Local disk artifacts (export/*.jsonl, logs/lazu-*.log): JSONL 7 day safety
#   net after upload, app logs 7 days

# Model request / response JSONL log
model_log_enabled: true
model_log_filename: requests.jsonl

upload:
  # Toggle for the scheduled remote-upload job
  enable: false
  # Hourly in the configured timezone. Closed JSONL shards are uploaded and
  # deleted after verification; the current writer-owned shard stays local.
  schedule: "0 * * * *"
  timezone: Asia/Shanghai
  # Verify each upload by fetching it back through public_base_url
  verify_via_public_url: true
  public_base_url: ""
  # Delete the local copy after a successful verification
  delete_after_verify: true
  s3:
    endpoint: "${R2_ENDPOINT}"
    region: "auto"
    bucket: "${R2_BUCKET}"
    access_key_id: "${R2_ACCESS_KEY_ID}"
    secret_access_key: "${R2_SECRET_ACCESS_KEY}"
  email:
    # Send a notification email when the scheduled job finishes
    enable: true
    # Recipient(s); semicolon-separated for multiple addresses
    to: "${ADMIN_EMAIL}"
    # Display sender (actual auth depends on SMTP / Resend domain config)
    from: noreply@lazu.ai
    # Subject prefix attached to every notification email

artifact_storage:
  enable: true
  base_path: user-files
  public_base_url: ""
  s3:
    endpoint: "${R2_ENDPOINT}"
    region: "auto"
    bucket: "${R2_BUCKET}"
    access_key_id: "${R2_ACCESS_KEY_ID}"
    secret_access_key: "${R2_SECRET_ACCESS_KEY}"

oss_url_cache:
  enable: true
  request_file_path: request_file
  cache_dir: user-request-file-cache
  cache_ttl_minutes: 30
  s3:
    endpoint: "${R2_ENDPOINT}"
    region: "auto"
    bucket: "${R2_BUCKET}"
    access_key_id: "${R2_ACCESS_KEY_ID}"
    secret_access_key: "${R2_SECRET_ACCESS_KEY}"

# Email delivery
# Resend is preferred; SMTP below is the fallback if Resend is not configured.
resend:
  api_key: "${RESEND_API_KEY}"
  from: "Lazu <noreply@lazu.ai>"

smtp:
  # Fallback SMTP transport (used only when Resend is not configured)
  server: ""
  port: 465
  ssl_enabled: true
  account: "${SMTP_ACCOUNT}"
  from: ""
  from_name: ""
  token: "${SMTP_TOKEN}"

# Email notification switches. Subjects and layouts are fixed in code
# (internal/common/email_templates/, brand/foundations/emails.md).
email_notifications:
  # Display name shown as the sender
  from_name: Lazu
  # Max emails per broadcast batch; tune to stay under provider throughput limits
  batch_size: 200
  # Operational alerts (disk, error rate, payment documents, backups) go here.
  admin_email: "${ADMIN_EMAIL}"
  # Mail when an operator adjusts a balance or completes a top-up by hand.
  balance_change:
    enabled: true
  low_balance:
    enabled: true
    threshold_usd: 20
    # Low-balance reminder schedule (days 1, 3, 7, 15, 30 below threshold).
    # After day 30 reminders stop until the balance rises above the threshold again.
    remind_days: [1, 3, 7, 15, 30]

# -----------------------------------------------------------
# Site identity (optional)
# Where this deployment's console and gateway are reached, who operates it,
# and where mail footers point. Empty values fall back to FRONTEND_BASE_URL,
# then http://localhost:3000; the operator is simply not shown.
# -----------------------------------------------------------
# site:
#   web_origin: "https://console.example.com"
#   api_origin: "https://api.example.com"
#   operator: "Example Inc."
#   support_email: "support@example.com"
#   # AGPL-3.0 asks a network service to offer its source to its users; the
#   # console's Help menu links here.
#   source_url: "https://github.com/your-org/your-fork"

# -----------------------------------------------------------
# Probe identities (optional)
# A source can be restricted to one client, such as "Claude Code clients only"
# in the source form. Health probes and observation checks are not that client,
# so such a source refuses them unless you configure what they present here.
# Customer requests never use these values; they always carry their own.
#   user_agent  User-Agent of the probe request
#   headers     extra request headers
#   metadata    JSON object set as the request's `metadata` when it has none;
#               {{device_id}} is a stable per-source id, {{session_id}} a UUID
# -----------------------------------------------------------
# probe_identities:
#   claude_code:
#     user_agent: ""
#     headers: {}
#     metadata: ""

# -----------------------------------------------------------
# Source checks (optional)
# A source added with "observe before going live" keeps its new models in
# inventory: probed, never routed. These bars decide when such a route has
# earned traffic. The values below are the built-in defaults; set your own.
#   observation_days        days a new route is watched before it may go live
#   min_samples             least liveness probes that can back a verdict
#   min_success_rate        share of liveness probes that must succeed (0-1]
#   max_billing_ratio       billed input over sent input the billing check
#                           allows; a higher ratio suggests an injected prompt
#   billing_framing_tokens  absolute excess that passes whatever the ratio
#                           says, for chat templates with a fixed overhead
#   long_context_tokens     input size of the long-context check
#   long_context_min_share  share of that input the upstream must bill (0-1];
#                           less suggests it cuts long inputs
#   check_every_hours       how often each check runs on a watched route
# -----------------------------------------------------------
# source_checks:
#   observation_days: 5
#   min_samples: 20
#   min_success_rate: 0.95
#   max_billing_ratio: 1.10
#   billing_framing_tokens: 256
#   long_context_tokens: 32000
#   long_context_min_share: 0.7
#   check_every_hours: 24
