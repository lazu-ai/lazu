# Extensions add http-level configuration (maps) here. Their templates live in
# apps/web/nginx.d/ and are rendered to /etc/nginx/conf.d/lazu/ at start.
include /etc/nginx/conf.d/lazu/http.d/*.conf;

server {
  listen 80;
  server_name _;
  # The public TLS terminator proxies to nginx over HTTP. Relative redirects
  # preserve the browser's original https scheme instead of leaking the
  # internal hop into Location headers.
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  # Docker Compose service IPs can change after backend recreation.
  # Resolve through Docker DNS so /api and /v1 keep following lazu-backend.
  resolver 127.0.0.11 ipv6=off valid=30s;
  resolver_timeout 5s;
  set $backend_upstream http://lazu-backend:3000;
  set $docs_upstream http://lazu-docs:80;

  # The public TLS terminator reaches nginx over plain HTTP, so $scheme says
  # "http" and $host drops any non-default public port: both describe the
  # internal hop rather than the URL the user typed. /setup renders that URL
  # into an installer an agent will call, so the external ones are carried
  # through when the terminator sent them. Only that terminator can reach
  # this container, and it sets these headers itself.
  set $fwd_proto $scheme;
  if ($http_x_forwarded_proto) {
    set $fwd_proto $http_x_forwarded_proto;
  }
  set $fwd_host $http_host;
  if ($http_x_forwarded_host) {
    set $fwd_host $http_x_forwarded_host;
  }

  # One host per site: www.<domain> answers with a permanent redirect to the
  # apex so search engines never split one page across two addresses.
  if ($fwd_host ~* ^www\.(.+)$) {
    return 301 $fwd_proto://$1$request_uri;
  }

  # Set-Cookie value the public locations below send when an extension sets
  # it; nginx omits an empty header.
  set $ref_cookie "";

  # Extensions add server-level configuration and locations here, ahead of
  # the core's own locations.
  include /etc/nginx/conf.d/lazu/server.d/*.conf;

  # Addresses with nothing behind them answer 404 with the prerendered status
  # page (StatusPage + public chrome), not the home page with a 200.
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Content-hashed Vite assets are immutable. Keeping them for a year avoids
  # cold repeat downloads while every release still gets a new asset URL.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Chrome partials (header, footer, head tags) that the API-rendered pages
  # pull in through SSI. Never addressable from outside.
  location /__chrome/ {
    internal;
  }

  # Canonical legal-document URLs. Preserve old bookmarks and any campaign
  # query parameters, but give crawlers one stable URL per language.
  location ~ ^/privacy-policy/?$ { return 308 /privacy$is_args$args; }
  location ~ ^/user-agreement/?$ { return 308 /terms$is_args$args; }
  location ~ ^/(zh|zh-TW|ja)/privacy-policy/?$ { return 308 /$1/privacy$is_args$args; }
  location ~ ^/(zh|zh-TW|ja)/user-agreement/?$ { return 308 /$1/terms$is_args$args; }

  # Retired public addresses.
  location ~ ^/pricing/?$ { return 301 /models$is_args$args; }
  location ~ ^/status/?$ { return 301 /; }

  # Public docs live under the main domain and are served by the Vocs
  # container. The path is passed through unchanged (/docs/...).
  location = /doc { return 308 /docs$is_args$args; }
  location ~ ^/doc/(.*)$ { return 308 /docs/$1$is_args$args; }
  # The variable form keeps nginx starting even while lazu-docs is down.
  location = /docs {
    include /etc/nginx/conf.d/lazu/page.d/*.conf;
    add_header Set-Cookie $ref_cookie always;
    proxy_pass $docs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $fwd_host;
    proxy_set_header X-Forwarded-Host $fwd_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # ^~ so /docs/*.md never falls to the Markdown location below.
  location ^~ /docs/ {
    include /etc/nginx/conf.d/lazu/page.d/*.conf;
    add_header Set-Cookie $ref_cookie always;
    proxy_pass $docs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $fwd_host;
    proxy_set_header X-Forwarded-Host $fwd_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # /quickstart retired into the docs site.
  location = /quickstart { return 308 /docs/quickstart$is_args$args; }
  location ~ ^/(zh|zh-TW|ja)/quickstart/?$ { return 308 /docs/$1/quickstart$is_args$args; }

  # The model catalog and model pages are rendered by the API so prices are
  # current without a redeploy. The API writes SSI
  # includes for the shared public chrome (header, footer, stylesheet tags),
  # which this server resolves from the partials the web build emitted.
  location ~ ^/(?:(?:zh|zh-TW|ja)/)?(?:models(?:[/.]|$)|(?:privacy|terms)(?:\.md)?/?$) {
    include /etc/nginx/conf.d/lazu/page.d/*.conf;
    ssi on;
    ssi_types text/html;
    add_header Set-Cookie $ref_cookie always;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    # SSI can only rewrite an uncompressed body.
    proxy_set_header Accept-Encoding "";
    proxy_set_header Host $fwd_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $fwd_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_intercept_errors off;
  }

  # Proxy API and streaming endpoints to backend
  location ~ ^/(api|v1|v1beta|pg|setup|livez|readyz)(/|$) {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $fwd_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $fwd_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    # WebSocket / SSE friendly
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  # Everything the single-page app owns (console, sign-in, payment returns,
  # invites …) boots from the unprerendered shell. Keep this list in step with
  # the top-level routes in src/App.tsx; extensions add their own.
  location ~ ^/(console|invite|login|register|reset|user|auth|payment|forbidden|key|keyusage)(/|$) {
    try_files /app.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Set-Cookie $ref_cookie always;
  }

  # HTML must be revalidated so a new deployment never leaves an old
  # prerender paired with a new JavaScript bundle. The prerender still gives
  # users an immediate first paint while the browser checks freshness.
  # Only prerendered pages and real files answer; the rest is a 404.
  location / {
    include /etc/nginx/conf.d/lazu/page.d/*.conf;
    # Prefer a prerendered directory index before testing the directory itself.
    # Otherwise nginx redirects canonical /privacy to /privacy/ even though the
    # generated page declares the slashless URL as canonical.
    try_files $uri/index.html $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Set-Cookie $ref_cookie always;
    # The edge may keep these public pages for five minutes (browsers still
    # revalidate every time). Only honoured where the Cloudflare cache rule
    # makes HTML eligible; every frontend deploy purges the edge
    # (the production deploy script), so a new bundle never meets an old page.
    add_header CDN-Cache-Control "max-age=300" always;
  }

  # Markdown siblings of the public pages, for agents.
  location ~ \.md$ {
    include /etc/nginx/conf.d/lazu/page.d/*.conf;
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "max-age=300" always;
  }

  client_max_body_size 64m;
}
