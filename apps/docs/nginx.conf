# The docs live at https://lazu.ai/docs. The web container proxies /docs and
# /docs/* here with the path unchanged, so this container serves the site
# under /docs itself: the Vocs build (basePath "/docs") is copied to
# /usr/share/nginx/html/docs, and every URL below carries the prefix.

# docs.lazu.ai is retired: anything that still reaches this container under
# that hostname (Caddy forwards the public Host; a proxy in front of it may
# only set X-Forwarded-Host) is sent to the same page under lazu.ai/docs.
map "$host|$http_x_forwarded_host" $lazu_docs_legacy_host {
  default 0;
  "~*(^|[|,\s])docs\.lazu\.ai(:\d+)?($|[|,\s])" 1;
}

# Where a legacy request goes. The docs home is slashless
# (https://lazu.ai/docs), and old /docs/* spellings lose the doubled prefix.
map $request_uri $lazu_docs_legacy_target {
  "~^/(?<query>\?.*)?$" https://lazu.ai/docs$query;
  "~^/docs(?<rest>[/?].*)?$" https://lazu.ai/docs$rest;
  default https://lazu.ai/docs$request_uri;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # Redirects stay relative so they keep the public scheme, host and port the
  # proxy in front of this container answered on.
  absolute_redirect off;

  if ($lazu_docs_legacy_host) {
    return 301 $lazu_docs_legacy_target;
  }

  # Nothing lives outside /docs. The bare root (someone opening the container
  # port directly) goes to the docs home; any other path is a real 404.
  location = / {
    return 302 /docs;
  }

  location / {
    return 404;
  }

  # Locale homes are canonical with their slash (/docs/zh/, as the sitemap
  # and hreflang say). Served slashless, Vocs' sidebar keys (/zh/) miss the
  # client's "/zh", React re-renders an English sidebar over the Chinese
  # prerender and throws #418. Send the slashless spelling to the canonical.
  location ~ ^/docs/(zh|zh-TW|ja)$ {
    return 301 /docs/$1/$is_args$args;
  }

  # ──────────────────────────────────────────────────────────────────
  # Cache-Control
  # ──────────────────────────────────────────────────────────────────
  # Vocs emits content-hashed filenames under /docs/assets/, so those can be
  # cached aggressively + immutable. Everything else — HTML, the
  # OpenAPI spec, the LLM index, the sidebar-extras script — has to
  # revalidate every request so a fresh deploy is visible without the
  # user hard-refreshing. Without these directives nginx ships only
  # Last-Modified + ETag, and browsers fall back to heuristic caching
  # (≈10% of resource age), which makes JSON specs and the sidebar
  # script feel stale for minutes after a deploy.

  # Long-cache fingerprinted assets (Vite/Vocs output).
  location ^~ /docs/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Vocs fingerprints the local search index as well as the JS assets.
  location ~ ^/docs/\.vocs/search-index-[A-Za-z0-9_-]+\.json$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # OpenAPI per-locale specs change on every translation update — never
  # serve a stale copy without revalidating against ETag / Last-Modified.
  location ~ ^/docs/openapi(\..+)?\.(json|yaml)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Generated LLM-readable indexes — same reasoning as the spec.
  location ~ ^/docs/llms(-full)?\.txt$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    # Edge copy for five minutes where the Cloudflare cache rule allows it;
    # every docs deploy purges the edge (the production deploy script).
    add_header CDN-Cache-Control "max-age=300" always;
  }

  # The injected chrome scripts are plain JS without a hash; we want every
  # deploy to land immediately.
  location ~ ^/docs/(sidebar-extras|agent-actions|site-footer)\.js$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Per-route Markdown siblings (/docs/endpoints/chat.md). Agents and the Copy
  # page action read these; serve them as UTF-8 Markdown, not octet-stream.
  location ~ ^/docs/.*\.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    # Edge copy for five minutes where the Cloudflare cache rule allows it;
    # every docs deploy purges the edge (the production deploy script).
    add_header CDN-Cache-Control "max-age=300" always;
  }

  # Canonical URLs are slashless (sitemap, <link rel="canonical">), the docs
  # home included (/docs). Send the trailing-slash spelling there, except the
  # locale roots, whose canonical form keeps the slash (/docs/zh/).
  location = /docs/ {
    return 301 /docs$is_args$args;
  }

  location ~ ^/docs/(?!(?:zh|zh-TW|ja)/$)(.+)/$ {
    return 301 /docs/$1$is_args$args;
  }

  # Every docs page is prerendered, so an address with no file behind it is
  # a real 404: answer with that status and the docs 404 shell
  # (scripts/postbuild-404.ts) instead of the home page with a 200.
  # Prerendered pages are served straight from their directory index, so a
  # slashless URL answers 200 instead of nginx's directory redirect. All HTML
  # must revalidate so route entries pick up new asset bundle filenames
  # after deploy.
  error_page 404 /docs/404.html;

  location = /docs/404.html {
    internal;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location /docs {
    try_files $uri ${uri}index.html $uri.html $uri/index.html =404;
    add_header Cache-Control "no-cache, must-revalidate" always;
    # Edge copy for five minutes where the Cloudflare cache rule allows it;
    # every docs deploy purges the edge (the production deploy script).
    add_header CDN-Cache-Control "max-age=300" always;
  }
}
