<!-- @dsCard group="Colors" viewport="700x390" name="Kumo Native · Warm Utility" subtitle="Locked semantic light and dark color system" -->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;color:var(--lazu-ink);background:#eeede8;font-family:var(--lazu-font-sans)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.theme{padding:14px;border:1px solid var(--lazu-border);border-radius:9px;background:var(--lazu-page);color:var(--lazu-ink)}.theme.dark{--lazu-page:#171715;--lazu-surface:#1e1e1b;--lazu-surface-muted:#252522;--lazu-surface-raised:#2b2b27;--lazu-border:#34342f;--lazu-ink:#f3f2ed;--lazu-text-muted:#b4b2aa;--lazu-action:#ff8a45;--lazu-action-soft:#3b251a;--lazu-on-action:#1b120d;--lazu-success:#62c495;--lazu-warning:#e7ad5e;--lazu-danger:#eb817b}.theme h2{margin:0 0 12px;font:700 8px var(--lazu-font-mono);letter-spacing:.09em}.surfaces{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.surface{height:48px;border:1px solid var(--lazu-border);border-radius:6px;background:var(--lazu-surface)}.surface:nth-child(2){background:var(--lazu-surface-muted)}.surface:nth-child(3){background:var(--lazu-surface-raised)}.surface:nth-child(4){border-color:var(--lazu-action);background:var(--lazu-action)}.type{margin-top:12px}.type strong{display:block;font-size:18px;letter-spacing:-.035em}.type span{color:var(--lazu-text-muted);font-size:10px}.signals{display:flex;gap:6px;margin-top:13px}.signal{display:flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid var(--lazu-border);border-radius:5px;background:var(--lazu-surface);font-size:9px}.signal i{width:6px;height:6px;border-radius:50%;background:var(--lazu-success)}.signal.warn i{border-radius:1px;background:var(--lazu-warning);transform:rotate(45deg)}.signal.bad i{border-radius:1px;background:var(--lazu-danger)}.rule{margin-top:12px;padding:10px 12px;border:1px solid var(--lazu-border);border-radius:7px;background:var(--lazu-surface);color:var(--lazu-text-muted);font-size:10px}.rule b{color:var(--lazu-action)}
  </style>
</head>
<body>
  <div class="grid">
    <section class="theme"><h2>LIGHT · DEFAULT</h2><div class="surfaces"><div class="surface"></div><div class="surface"></div><div class="surface"></div><div class="surface"></div></div><div class="type"><strong>路由、成本与可靠性</strong><span>暖白灰建立结构，暖橙只标记主要动作。</span></div><div class="signals"><span class="signal"><i></i>healthy</span><span class="signal warn"><i></i>degraded</span><span class="signal bad"><i></i>down</span></div></section>
    <section class="theme dark"><h2>DARK · SEMANTIC MAPPING</h2><div class="surfaces"><div class="surface"></div><div class="surface"></div><div class="surface"></div><div class="surface"></div></div><div class="type"><strong>Warm neutral dark</strong><span>不再使用 Routing Ink 的灰紫环境。</span></div><div class="signals"><span class="signal"><i></i>healthy</span><span class="signal warn"><i></i>degraded</span><span class="signal bad"><i></i>down</span></div></section>
  </div>
  <div class="rule"><b>Permission:</b> orange for action · neutral fill for navigation · chroma for semantic state.</div>
</body>
</html>
