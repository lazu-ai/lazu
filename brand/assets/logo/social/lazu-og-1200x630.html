         --allow-file-access-from-files --window-size=1200,630 \
         --virtual-time-budget=6000 --screenshot=lazu-og-1200x630.png \
         file://$PWD/lazu-og-1200x630.html

     apps/web/public/og-image.png and the logo package.
     Design canvas: "Lazu OG" option K (2026-11-03). Brand tokens: dark ground
     #0F0F11, paper #F8F8F6, teal #4FB3AD / #175855; the card has a hairline,
     no shadow. -->
