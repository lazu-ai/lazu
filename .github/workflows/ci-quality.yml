name: CI Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Re-check the current dependency graph after upstream advisories change,
    # even when the repository itself has not changed.
    - cron: "23 3 * * 1"

concurrency:
  group: ci-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      web: ${{ steps.detect.outputs.web }}
      web_dependencies: ${{ steps.detect.outputs.web_dependencies }}
      docs: ${{ steps.detect.outputs.docs }}
      security: ${{ steps.detect.outputs.security }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check brand residue
        run: |
          bash ops/scripts/check-brand-residue.sh --self-test
          bash ops/scripts/check-brand-residue.sh

      - name: Check the single error path
        run: python3 ops/scripts/check_error_outlets.py

      - name: Verify documentation links and locale topics
        run: make test-docs

      - name: Detect quality gates
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
              changed_files="$(git diff --name-only HEAD^1 HEAD^2)"
            else
              changed_files="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            fi
          elif [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          fi

          backend=false
          web=false
          web_dependencies=false
          docs=false
          security=false

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            changed_files=""
            security=true
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              .github/workflows/ci-quality.yml)
                backend=true
                web=true
                web_dependencies=true
                docs=true
                security=true
                ;;
              brand/*)
                web=true
                docs=true
                ;;
              apps/web/*)
                web=true
                ;;
              apps/docs/*)
                docs=true
                ;;
              apps/api/*|apps/migrate/*|apps/worker/*|config/backend/*|internal/*|ops/scripts/*|ops/sql/*|ops/tools/*|packages/*|pkg/*|platform/docker/*|Makefile|go.mod|go.sum|lefthook.yml)
                backend=true
                ;;
            esac
            case "$file" in
              # Error copy and the generated docs reference are checked by
              # Go tests against the catalog.
              apps/web/src/i18n/locales/errors/*|apps/docs/pages/errors.mdx|apps/docs/pages/*/errors.mdx)
                backend=true
                ;;
            esac
            case "$file" in
              packages/contracts/openapi/*)
                web=true
                docs=true
                ;;
            esac
            case "$file" in
              apps/web/package.json|apps/web/bun.lock|apps/web/patches/*)
                web_dependencies=true
                ;;
            esac
          done <<< "$changed_files"

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "web_dependencies=$web_dependencies" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "security=$security" >> "$GITHUB_OUTPUT"

          echo "Selected gates: backend=$backend web=$web web_dependencies=$web_dependencies docs=$docs security=$security"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lazu_test_core
        ports:
          - 5432:5432
        options: >-
          --volume /tmp/lazu-pr380-postgres:/var/run/postgresql
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_GATEWAY_CORE_DSN: postgres://postgres:postgres@localhost:5432/lazu_test_core?sslmode=disable # secret-scan: allow -- public credentials for disposable CI fixtures only
      TEST_GATEWAY_TELEMETRY_DSN: postgres://postgres:postgres@localhost:5432/lazu_test_telemetry?sslmode=disable # secret-scan: allow -- public credentials for disposable CI fixtures only
      LAZU_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/lazu_audit_test_backend?sslmode=disable # secret-scan: allow -- public credentials for disposable CI fixtures only
      TEST_GATEWAY_CORE_UNIX_DSN: postgres://postgres:postgres@/lazu_test_core?host=/tmp/lazu-pr380-postgres&sslmode=disable # secret-scan: allow -- public disposable CI fixture credentials
      TEST_LEDGER_REDIS_URL: redis://localhost:6379/1
      TEST_LEDGER_ADAPTER_REDIS_URL: redis://localhost:6379/2
      TEST_REDIS_URL: redis://localhost:6379/3
      TEST_LEDGER_ROLLBACK_REDIS_URL: redis://localhost:6379/4
      TEST_LEDGER_BACKLOG_REDIS_URL: redis://localhost:6379/5
      ALERTING_TEST_REDIS_URL: redis://localhost:6379/6
      REDIS_CONN_STRING: redis://localhost:6379/7
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Prepare isolated native integration fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server postgresql-client
          PGPASSWORD=postgres createdb -h localhost -U postgres lazu_test_telemetry # secret-scan: allow -- public credentials for disposable CI fixtures only
          PGPASSWORD=postgres createdb -h localhost -U postgres lazu_audit_test_backend # secret-scan: allow -- public credentials for disposable CI fixtures only
          redis-cli -h localhost CONFIG SET appendonly yes

      - name: Run all Go tests with native integration coverage
        shell: bash
        run: |
          set -euo pipefail
          go test -p 1 -count=1 -json ./... | tee "$RUNNER_TEMP/lazu-go-tests.jsonl"
          python3 ops/scripts/check-native-test-coverage.py "$RUNNER_TEMP/lazu-go-tests.jsonl"

      - name: Check deployment schema refusal
        run: |
          # The production deploy script and its test live with lazu.ai's
          # private operations; repositories without them skip this check.
          if [ -f ops/scripts/deploy_schema_test.py ]; then
            python3 ops/scripts/deploy_schema_test.py
          fi
          python3 ops/scripts/check_native_test_coverage_test.py

      - name: Run Go vet
        run: go vet ./...

      - name: Check the docs error reference is current
        run: go run ./ops/tools/errdocs -check

      - name: Check every route has a caller, a document or an allowlist entry
        run: make test-route-coverage

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scan tracked files for secrets
        run: make test-secrets

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-web-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-web-

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck web
        run: bun run typecheck

      - name: Check Brand contract
        run: bun run brand:check

      - name: Lint web
        run: |
          bun run lint
          bun run eslint

      - name: Test and build web
        run: |
          bun run test:unit
          bun run build

      - name: Install browser for control appearance regressions
        run: bunx playwright install --with-deps chromium

      - name: Check control appearance across themes and popup hosts
        run: bun run test:smoke tests/smoke/control-style-regressions.spec.ts

      - name: Check web bundle budgets
        run: bun run size

      - name: Check web i18n coverage
        run: bun run i18n:check

      - name: Audit web dependencies
        if: needs.changes.outputs.web_dependencies == 'true'
        run: bun audit --audit-level=high

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci

      - name: Typecheck docs
        run: npm run typecheck

      - name: Check docs Brand contract
        run: npm run brand:check

      - name: Lint docs
        run: npm run lint

      - name: Build docs
        run: npm run build

      - name: Audit docs dependencies
        run: npm audit --audit-level=high

  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Re-check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Re-check web dependency advisories
        working-directory: apps/web
        run: bun audit --audit-level=high

      - name: Re-check docs dependency advisories
        working-directory: apps/docs
        run: npm audit --audit-level=high
