name: Bug report
description: Something in Lazu is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security vulnerabilities
        should NOT be filed here — please use GitHub's private vulnerability
        reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, with the exact error message or wrong behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Lazu?
      options:
        - Docker (docker-compose)
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The version under Help in the console, or `git rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. Remove API keys, tokens, and personal data first.
      render: shell
