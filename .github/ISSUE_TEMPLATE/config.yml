blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/lazu-ai/lazu/security/advisories/new
    about: Report security issues privately through GitHub's private vulnerability reporting, never in a public issue.
  - name: Question or idea
    url: https://github.com/lazu-ai/lazu/discussions
    about: Ask how to run or extend Lazu, or float an idea before writing it up.
  - name: Problem with the hosted service at lazu.ai
    url: mailto:support@lazu.ai
    about: Account, billing and hosted-service questions go to support, not to this tracker.
