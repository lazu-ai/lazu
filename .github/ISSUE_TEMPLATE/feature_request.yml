name: Feature request
description: Suggest an improvement or new capability for Lazu
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution — what are you doing, and where does Lazu get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Lazu to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you considered
