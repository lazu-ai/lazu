  /v1/decisions:
    post:
      tags: [Decisions]
      summary: Evaluate explicit decision questions over text, JSON or embedded images.
      operationId: createDecision
      description: |
        Non-streaming probability, choice and score evaluation. Disabled by default.
        The official request model gpt-6-luna uses OpenAI-style input plus ordered questions and answers.
        Its Decisions catalog ID gpt-6-luna-decisions keeps routing and pricing separate from Chat/Responses.
        The alias remains accepted as a compatibility request name.
        The alias also accepts the legacy state/keyed-questions bridge; input and
        state cannot be mixed. Launch limits are 8192 estimated text tokens across
        input and questions, 64 questions, 4 inline images, and 2–10 score levels.
        These are Lazu limits, not a claim about the provider's maximum context.
        A per-question refusal is a valid 200 result, billed using reported usage.
        Optional question_generation compiles model + state through an independently
        authorized, billed Responses request. Native usage excludes generation usage.
        Explicit questions take precedence. Invalid generated questions are refunded;
        native failures after valid generation retain that charge and return reusable questions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: Validated answers, upstream usage, and optional generated questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        '400':
          description: Invalid questions, unsupported input, streaming or missing questions.
        '401':
          description: Invalid API key.
        '403':
          description: Key, project, IP or temporary credential does not authorize either model.
        '404':
          description: Decision API disabled, or model unavailable.
        '413':
          description: Request exceeds the configured body limit.
        '429':
          description: Account or Key budget, rate limit, or upstream capacity exhausted.
          headers:
            Retry-After:
              schema: {type: string}
        '502':
          description: Invalid upstream answer or unusable generated questions. Error details can include reusable questions.
