                type: string
        encoding_format:
          type: string
          enum:
            - float
            - base64
        dimensions:
          type: integer
    EmbeddingsResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                example: embedding
              index:
                type: integer
              embedding:
                type: array
                items:
                  type: number
                  format: float
        model:
          type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer
    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Search query. The MVP supports one query per request.
          example: latest OpenAI web search API changes
        type:
          type: string
          description: Search vertical.
          enum:
            - web
            - news
          default: web
        region:
          type: string
          description: Region hint. Serper maps this to `gl`.
          example: us
        country:
          type: string
          description: Country hint for providers that use country instead of region.
          example: US
        language:
          type: string
          description: Language hint.
          example: en
        time_range:
          type: string
          description: Freshness hint.
          enum:
            - day
            - week
            - month
            - year
        max_results:
          type: integer
          description: Number of normalized results to return, capped by backend policy.
          minimum: 1
          maximum: 50
          default: 10
        include_answer:
          type: boolean
          description: Include a provider answer when available. Lazu does not generate its own final answer for this endpoint.
          default: false
        include_raw_content:
          type: boolean
          description: Include provider raw or cleaned content when available.
          default: false
        include_provider_payload:
          type: boolean
          description: Return provider-native payload for debugging.
          default: false
        backend:
          type: string
          description: Auto, provider name, backend ID, or backend name.
          default: auto
          example: auto
        include_domains:
          type: array
          description: Restrict results to domains. Token-level domain allowlists still apply.
          items:
            type: string
          example:
            - openai.com
        exclude_domains:
          type: array
          description: Exclude domains when supported by the selected backend.
          items:
            type: string
        search_depth:
          type: string
          description: Provider depth hint. Tavily advanced uses two billable credits.
          enum:
            - basic
            - advanced
          default: basic
        provider_options:
          type: object
          description: Advanced provider passthrough. Only the selected provider's object is used.
          additionalProperties: true
          example:
            serper:
              tbs: qdr:d
              page: 2
    SearchResponse:
      type: object
      required:
        - query
        - results
        - usage
        - provider_trace
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        answer:
          type: string
          nullable: true
        usage:
          $ref: "#/components/schemas/SearchUsage"
        provider_trace:
          $ref: "#/components/schemas/SearchProviderTrace"
        route_receipt:
          $ref: "#/components/schemas/SearchRouteReceipt"
        provider_payload:
          type: object
          description: Provider-native payload returned only when include_provider_payload is true.
          nullable: true
          additionalProperties: true
    SearchResult:
      type: object
      required:
        - title
        - url
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        snippet:
          type: string
        content:
          type: string
          nullable: true
        published_at:
          type: string
          nullable: true
        score:
          type: number
          format: double
          nullable: true
        source:
          type: string
          example: web
    SearchUsage:
      type: object
      required:
        - web_search_requests
      properties:
        web_search_requests:
          type: integer
          description: Lazu search request count, normally 1.
          example: 1
        web_search_billable_units:
          type: integer
          description: Provider billing units used for the charge. Tavily basic is 1, Tavily advanced is 2, and Serper is normally 1 successful query.
          example: 1
    SearchProviderTrace:
      type: object
      required:
        - backend
      properties:
        backend:
          type: string
          description: Actual provider selected after routing.
          example: tavily
    SearchRoutingRejected:
      type: object
      properties:
        backend:
          type: string
        reason:
          type: string
    SearchRouteReceipt:
      type: object
      properties:
        selection:
          type: string
          example: auto
        selected_backend:
          type: string
          example: tavily
        chose_provider:
          type: string
          example: tavily
        candidates:
          type: array
          items:
            type: string
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/SearchRoutingRejected"
        downgraded:
          type: boolean
        fallback_count:
          type: integer
        decision_reason:
          type: string
    ImageGenerationRequest:
      type: object
      required:
        - model
      properties:
        model:
          type: string
        prompt:
          type: string
          description: Required for generation; optional for Seedream layer decomposition.
        image:
          description: Seedream reference URL/data URL or array. Edits use this field on the generations endpoint.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        layer_decomposition:
          type: boolean
          default: false
          description: Seedream Pro/Flash only; exactly one image. Up to 16 layers plus the base image.
        sequential_image_generation:
          type: string
          enum: [disabled, auto]
          description: Seedream Lite/4.5 only.
        sequential_image_generation_options:
          type: object
          properties:
            max_images:
              type: integer
              minimum: 1
              maximum: 15
              description: References plus max_images must not exceed 15.
        optimize_prompt_options:
          type: object
          additionalProperties: true
        watermark:
          type: boolean
        background:
          type: string
          enum: [opaque, transparent]
        stream:
          type: boolean
          const: false
        n:
          type: integer
          minimum: 1
          maximum: 15
          default: 1
        size:
          type: string
          description: Model-dependent. Seedream uses resolution levels (for example 2K) or supported widthxheight; consult the catalog.
          example: 2K
        quality:
          type: string
          enum:
            - standard
            - hd
        style:
          type: string
          enum:
            - vivid
            - natural
        response_format:
          type: string
          enum:
            - url
            - b64_json
    ImageGenerationResponse:
      type: object
      properties:
        usage:
          type: object
          additionalProperties: true
          properties:
            generated_images:
              type: integer
            input_images:
              type: integer
            cost:
              type: number
              description: Settled customer charge in USD.
        created:
          type: integer
          format: int64
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              b64_json:
                type: string
              size:
                type: string
                example: 2048x2048
              z_index:
                type: integer
                description: Decomposition stacking order; 0 is the base image.
              bounding_box:
                type: object
                additionalProperties: true
              name:
                type: string
              description:
                type: string
              error:
                type: object
                additionalProperties: true
                description: An unsuccessful image is not billed.
              revised_prompt:
                type: string
    VideoGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          example: veo-3
        prompt:
          type: string
          example: A cinematic shot of a product reveal
        seconds:
          type: integer
          minimum: 1
          example: 5
        size:
          type: string
          example: 1280x720
        aspect_ratio:
          type: string
          example: "16:9"
        quality:
          type: string
          example: hd
        response_format:
          type: string
          enum:
            - url
            - b64_json
        provider:
          type: string
          description: Optional provider hint.
        artifact_file_id:
          type: string
          description: Optional existing Lazu file id to register without provider execution.
        artifact_url:
          type: string
          format: uri
          description: Optional existing artifact URL to register without provider execution.
        upstream_job_id:
          type: string
    MediaJobObject:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: video
        kind:
          type: string
          enum:
            - image
            - video
        source:
          type: string
        model:
          type: string
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
        completed_at:
          type: integer
          format: int64
        session_id:
          type: string
        agent_id:
          type: string
        request_id:
          type: string
        artifact:
          type: object
          properties:
            file_id:
              type: string
            url:
              type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        request:
          type: object
          additionalProperties: true
        cost_snapshot:
          type: object
          description: Customer billing only. Procurement costs and internal usage facts are never exposed.
          additionalProperties: false
          properties:
            pricing_version:
              type: integer
            customer_charge_microusd:
              type: integer
            customer_charge_usd:
              type: number
            charged_microusd:
              type: integer
            line_items:
              type: array
              items:
                type: object
    MediaJobListResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/MediaJobObject"
    ResponsesRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        instructions:
          type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true
    ResponsesResponse:
      type: object
      additionalProperties: true
    DecisionRequest:
      oneOf:
        - $ref: '#/components/schemas/LegacyDecisionRequest'
        - $ref: '#/components/schemas/OpenAIDecisionRequest'
    LegacyDecisionRequest:
      type: object
      additionalProperties: false
      required: [model, state]
      properties:
        model:
          type: string
          examples: [jev-1.13, clef, clef-flash, gpt-6-luna-decisions]
        state:
          type: [string, object, array]
          description: Material to judge. Empty state is allowed only with valid embedded images.
        questions:
          type: object
          minProperties: 1
          maxProperties: 64
          propertyNames:
            pattern: '^[A-Za-z0-9_.-]{1,100}$'
          additionalProperties:
            $ref: '#/components/schemas/DecisionQuestion'
        images:
          type: array
          maxItems: 4
          description: Clef or the OpenAI alias's legacy bridge. PNG/JPEG/WebP inline data URLs; at most 4 MiB and 16 million pixels per image, 8 MiB total decoded, 13 MiB total encoded request. Remote URLs, file IDs, audio and video are unsupported.
          items:
            oneOf:
              - type: string
                pattern: '^data:image/(png|jpeg|webp);base64,'
              - type: object
                additionalProperties: false
                required: [url]
                properties:
                  url: {type: string, pattern: '^data:image/(png|jpeg|webp);base64,'}
        stream:
          type: boolean
          const: false
          default: false
        question_generation:
          type: object
          additionalProperties: false
          properties:
            enabled: {type: boolean, default: false}
            model: {type: string, maxLength: 200, examples: [gpt-6-luna]}
    OpenAIDecisionRequest:
      type: object
      additionalProperties: false
      required: [model, input, questions]
      properties:
        model: {type: string, enum: [gpt-6-luna, gpt-6-luna-decisions]}
        input:
          description: Lazu supports text or user-only messages. Input plus all questions is limited to 8192 estimated text tokens. Images use inline PNG/JPEG/WebP data URLs; at most 4 images, 4 MiB and 16 million pixels each, 8 MiB decoded total and 13 MiB encoded request total.
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [role, content]
                properties:
                  role: {type: string, const: user}
                  type: {type: string, const: message}
                  content:
                    oneOf:
                      - type: string
                        minLength: 1
                      - type: array
                        minItems: 1
                        items:
                          oneOf:
                            - type: object
                              additionalProperties: false
                              required: [type, text]
                              properties:
                                type: {type: string, const: input_text}
                                text: {type: string, minLength: 1}
                            - type: object
                              additionalProperties: false
                              required: [type, image_url]
                              properties:
                                type: {type: string, const: input_image}
                                image_url: {type: string, pattern: '^data:image/(png|jpeg|webp);base64,'}
                                detail: {type: [string, 'null'], enum: [low, high, auto, null]}
        questions:
          type: array
          minItems: 1
          maxItems: 64
          description: Ordered explicit questions. Optional names are preserved, including Unicode and empty strings. Lazu's initial release requires supplied names to be unique. Multiple unnamed questions remain separate by position.
          items:
            $ref: '#/components/schemas/OpenAIDecisionQuestion'
      examples:
        - model: gpt-6-luna
          input: The customer cannot log in.
          questions:
            - name: login_issue
              type: predicate
              instructions: Is this a login problem?
    OpenAIDecisionQuestion:
      type: object
      additionalProperties: false
      required: [type, instructions]
      properties:
        name: {type: string}
        type: {type: string, enum: [predicate, choice, score]}
        instructions: {type: string, minLength: 1}
        choices:
          type: array
          minItems: 2
          maxItems: 255
          description: Unique typed values. Boolean false and string "false" are different choices.
          items:
            type: object
            additionalProperties: false
            required: [value]
            properties:
              value: {type: [string, boolean]}
              description: {type: [string, 'null']}
        levels:
          type: array
          minItems: 2
          maxItems: 10
          description: Lazu launch limit of 2–10 ordered levels; score is the probability-weighted zero-based level index and may be fractional.
          items:
            type: object
            additionalProperties: false
            required: [label]
            properties:
              label: {type: string, minLength: 1}
              description: {type: [string, 'null']}
      allOf:
        - if: {properties: {type: {const: predicate}}}
          then:
            not:
              anyOf: [{required: [choices]}, {required: [levels]}]
        - if: {properties: {type: {const: choice}}}
          then:
            required: [choices]
            not: {required: [levels]}
        - if: {properties: {type: {const: score}}}
          then:
            required: [levels]
            not: {required: [choices]}
    OpenAIDecisionResponse:
      type: object
      additionalProperties: true
      required: [model, answers, usage]
      properties:
        model: {type: string, enum: [gpt-6-luna, gpt-6-luna-decisions]}
        answers:
          type: array
          description: One answer per question, in the same order. A refusal is a valid result for that question; other answers and reported usage remain intact.
          items:
            type: object
            additionalProperties: true
            required: [name, type]
            properties:
              name: {type: [string, 'null']}
              type: {type: string, enum: [predicate, choice, score, refusal]}
              probability: {type: number, minimum: 0, maximum: 1}
              confidence:
                type: number
                minimum: 0
                maximum: 1
                description: Separate from the probability of the selected choice.
              choice: {type: [string, boolean]}
              score: {type: number, minimum: 0}
              probabilities:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  required: [value, probability]
                  properties:
                    value: {type: [string, boolean, integer]}
                    label: {type: string}
                    probability: {type: number, minimum: 0, maximum: 1}
        usage:
          allOf:
            - $ref: '#/components/schemas/DecisionUsage'
            - type: object
              properties:
                total_tokens: {type: integer, minimum: 0}
                input_tokens_details:
                  type: object
                  additionalProperties: true
                  properties:
                    image_tokens: {type: integer, minimum: 0}
                    cached_tokens: {type: integer, minimum: 0}
                    cache_write_tokens: {type: integer, minimum: 0}
                output_tokens_details:
                  type: object
                  additionalProperties: true
                  properties:
                    reasoning_tokens: {type: integer, minimum: 0}
    DecisionQuestion:
      type: object
      additionalProperties: false
      required: [type, instructions]
      properties:
        type: {type: string, enum: [noul, choice, score]}
        instructions:
          type: [string, object, array]
          description: Explicit judgment; business JSON is preserved.
        criteria:
          description: Choice uses an object with 2–255 option IDs and raw descriptions (including null). Score uses 2–10 ordered raw levels. Noul omits criteria.
          oneOf:
            - type: object
              minProperties: 2
              maxProperties: 255
              additionalProperties: true
            - type: array
              minItems: 2
              maxItems: 10
              items: {}
      allOf:
        - if:
            properties:
              type: {const: noul}
          then:
            not: {required: [criteria]}
        - if:
            properties:
              type: {const: choice}
          then:
            required: [criteria]
            properties:
              criteria: {type: object, minProperties: 2, maxProperties: 255}
        - if:
            properties:
              type: {const: score}
          then:
            required: [criteria]
            properties:
              criteria: {type: array, minItems: 2, maxItems: 10}
    DecisionUsage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens: {type: integer, minimum: 0}
        output_tokens:
          type: integer
          minimum: 0
          description: Preserve reported output usage even when output price is zero.
    DecisionResponse:
      oneOf:
        - $ref: '#/components/schemas/LegacyDecisionResponse'
        - $ref: '#/components/schemas/OpenAIDecisionResponse'
    LegacyDecisionResponse:
      type: object
      required: [id, object, created, model, answers, usage]
      properties:
        id: {type: string}
        object: {type: string, const: decision}
        created: {type: integer}
        model: {type: string}
        answers:
          type: object
          description: One answer per question ID. Provider extensions are preserved; answers are validated without coercion or repair.
          additionalProperties:
            type: object
            required: [type]
            additionalProperties: true
            properties:
              type: {type: string, enum: [noul, choice, score, refusal]}
              refusal: {type: boolean, description: Present for a refused question in the OpenAI legacy bridge. No prediction is fabricated.}
              confidence: {type: number, minimum: 0, maximum: 1}
              noul: {type: number, minimum: 0, maximum: 1}
              choice: {type: string}
              probabilities:
                type: object
                additionalProperties: {type: number, minimum: 0, maximum: 1}
              score: {type: number, minimum: 0}
              legend: {type: object, additionalProperties: true}
        usage: {$ref: '#/components/schemas/DecisionUsage'}
        questions:
          type: object
          additionalProperties: {$ref: '#/components/schemas/DecisionQuestion'}
        question_generation:
          type: object
          required: [model, request_id, prompt_version, usage]
          properties:
            model: {type: string}
            request_id: {type: string}
            prompt_version: {type: string}
            usage: {$ref: '#/components/schemas/DecisionUsage'}
        warnings: {type: array, items: {type: string}}
    RerankRequest:
      type: object
      required:
        - model
        - query
        - documents
      properties:
        model:
          type: string
        query:
          type: string
        documents:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
        top_n:
          type: integer
        return_documents:
          type: boolean
    RerankResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              relevance_score:
                type: number
                format: float
              document:
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: true
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
              description: English sentence for developers. May change; do not parse it.
            type:
              type: string
              description: What to do next. OpenAI-aligned; see https://lazu.ai/docs/errors.
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - rate_limit_error
                - api_error
                - overloaded_error
                - api_connection_error
                - timeout_error
                - content_policy_violation_error
                - insufficient_quota
            param:
              type: string
              description: The request field at fault, when there is one.
            code:
              description: What happened. Stable; branch on this. Provider codes may pass through unchanged for upstream errors.
              oneOf:
                - type: string
                - type: integer
            lazu:
              type: string
              pattern: "^LZ-[1-9][0-9]{3}$"
              description: Lazu error number, stable. Also sent as the X-Lazu-Error header.
            docs:
              type: string
              format: uri
              description: Link to this error number in the docs reference.
            request_id:
              type: string
              description: The request this error belongs to. Also sent as X-Lazu-Request-Id.
            details:
              type: object
              additionalProperties: true
              description: Structured values such as field, model or retry_after_seconds.
