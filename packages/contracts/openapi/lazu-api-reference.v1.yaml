          format: double
          nullable: true
        cache_write_1h_per_mtok:
          type: number
          format: double
          nullable: true
        audio_input_per_mtok:
          type: number
          format: double
          nullable: true
        audio_output_per_mtok:
          type: number
          format: double
          nullable: true
        image_input_per_mtok:
          type: number
          format: double
          nullable: true
        image_output_per_mtok:
          type: number
          format: double
          nullable: true
        peak_hours_utc:
          type: string
          nullable: true
          description: Comma-separated UTC hour ranges (e.g. "1-4,6-10") during which peak_multiplier applies.
        peak_multiplier:
          type: number
          format: double
          nullable: true
          description: Multiplier applied to every price field during peak_hours_utc (e.g. 2 for DeepSeek-style peak pricing).
        request_usd:
          type: number
          format: double
          nullable: true
        second_usd:
