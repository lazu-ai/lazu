        - messages
      properties:
        model:
          type: string
          description: 模型 ID
          example: gpt-4o-mini
        messages:
          type: array
          description: 对话消息列表
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        temperature:
          type: number
          format: double
          description: 采样温度，0-2 之间，值越高输出越随机
          minimum: 0
          maximum: 2
          default: 1
          example: 0.7
        max_tokens:
          type: integer
          description: 最大生成 token 数
          minimum: 1
          example: 1000
        stream:
          type: boolean
          description: 是否启用流式输出
          default: false
        top_p:
          type: number
          format: double
          description: 核采样参数
          minimum: 0
          maximum: 1
          default: 1
        frequency_penalty:
          type: number
          format: double
          description: 频率惩罚参数，-2 到 2 之间
          minimum: -2
          maximum: 2
          default: 0
        presence_penalty:
          type: number
          format: double
          description: 存在惩罚参数，-2 到 2 之间
          minimum: -2
          maximum: 2
          default: 0
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        response_format:
          type: object
          additionalProperties: true
        seed:
          type: integer
        n:
          type: integer
          minimum: 1
    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          description: 消息角色
          enum:
            - system
            - user
            - assistant
            - tool
        content:
          description: 消息内容
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: 唯一请求 ID
        object:
          type: string
          description: 响应对象类型
          example: chat.completion
        created:
          type: integer
          format: int64
          description: 创建时间戳
        model:
          type: string
          description: 使用的模型
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
        usage:
          $ref: "#/components/schemas/CompletionUsage"
    ChatCompletionChoice:
      type: object
      required:
        - index
        - message
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
          enum:
            - stop
            - length
            - content_filter
    CompletionUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          description: 输入 token 数
        completion_tokens:
          type: integer
          description: 输出 token 数
        total_tokens:
          type: integer
          description: 总 token 数
        prompt_cache_hit_tokens:
          type: integer
          description: Provider-native cache hit tokens when reported at top level, for example DeepSeek.
        prompt_cache_miss_tokens:
          type: integer
          description: Provider-native cache miss tokens when reported at top level, for example DeepSeek.
        prompt_tokens_details:
          $ref: "#/components/schemas/InputTokenDetails"
        input_tokens_details:
          $ref: "#/components/schemas/InputTokenDetails"
        completion_tokens_details:
          $ref: "#/components/schemas/OutputTokenDetails"
        output_tokens_details:
          $ref: "#/components/schemas/OutputTokenDetails"
        cost:
          type: number
          format: double
          description: Actual charged cost for this inference response in USD.
    InputTokenDetails:
      type: object
      properties:
        cached_tokens:
          type: integer
          description: Cache read tokens normalized from OpenAI cached tokens, DeepSeek cache hits, Gemini cachedContentTokenCount, Qwen cached_tokens, or Anthropic cache_read_input_tokens.
        cache_write_tokens:
          type: integer
          description: Cache creation/write tokens when the provider reports an unsplit total.
        cache_write_5m_tokens:
          type: integer
          description: Cache creation/write tokens with a 5-minute TTL when the provider reports TTL buckets.
        cache_write_1h_tokens:
          type: integer
          description: Cache creation/write tokens with a 1-hour TTL when the provider reports TTL buckets.
        cache_miss_tokens:
          type: integer
          description: Cache miss tokens when the provider reports them separately, for example DeepSeek prompt_cache_miss_tokens.
        text_tokens:
          type: integer
        audio_tokens:
          type: integer
        image_tokens:
          type: integer
    OutputTokenDetails:
      type: object
      properties:
        text_tokens:
          type: integer
        audio_tokens:
          type: integer
        reasoning_tokens:
          type: integer
        accepted_prediction_tokens:
          type: integer
        rejected_prediction_tokens:
          type: integer
    AnthropicMessageRequest:
      type: object
