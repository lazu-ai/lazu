          items:
            type: object
            additionalProperties: true
        systemInstruction:
          type: object
          additionalProperties: true
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        generationConfig:
          type: object
          additionalProperties: true
        safetySettings:
          type: array
          items:
            type: object
            additionalProperties: true
    GeminiGenerateContentResponse:
      type: object
      additionalProperties: true
    EmbeddingsRequest:
      type: object
