  /v1/search:
    post:
      tags:
        - Search
      summary: Run provider-neutral web or news search.
      description: |
        Executes a raw retrieval request through configured Lazu search backends such as Tavily, Serper, Exa, Jina, or Brave.

        The response uses a normalized result schema and includes both the Lazu request count and provider billable unit count.
        Use `/api/search/backends` in the console API to manage the available backends.
      operationId: createSearch
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: cURL
          label: Basic web search
          source: |
            curl https://api.lazu.ai/v1/search \
              -H "Authorization: Bearer $LAZU_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "query": "latest OpenAI web search API changes",
                "type": "web",
                "region": "us",
                "language": "en",
                "time_range": "month",
                "max_results": 5,
                "backend": "auto",
                "search_depth": "basic"
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            examples:
              web:
                summary: Web search through the automatic backend router
                value:
                  query: latest OpenAI web search API changes
                  type: web
                  region: us
                  language: en
                  time_range: month
                  max_results: 5
                  backend: auto
                  search_depth: basic
              serper_passthrough:
                summary: Serper with provider options
                value:
                  query: apple inc
                  type: web
                  backend: serper
                  include_provider_payload: true
                  provider_options:
                    serper:
                      tbs: qdr:d
                      page: 2
      responses:
        "200":
          description: Search response.
          headers:
            x-lazu-cost-usd:
              description: Actual charged cost for this search response in USD.
              schema:
                type: string
            x-lazu-request-id:
              description: Lazu request ID for cost and log correlation.
              schema:
                type: string
            x-lazu-warning:
              description: Compatibility warning such as `stateless_bridge`; the standard response body is unchanged.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              example:
                query: latest OpenAI web search API changes
                results:
                  - title: Web search - OpenAI API
                    url: https://platform.openai.com/docs/guides/tools-web-search
                    snippet: Use web search in the Responses API...
                    content: null
                    published_at: null
                    score: 0.91
                    source: web
                usage:
                  web_search_requests: 1
                  web_search_billable_units: 1
                provider_trace:
                  backend: tavily
                route_receipt:
                  selection: auto
                  selected_backend: tavily
                  chose_provider: tavily
                  candidates:
                    - tavily:primary
                  rejected: []
                  downgraded: false
                  fallback_count: 0
                  decision_reason: selected
        "400":
          description: Invalid search request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: No configured search backend is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
