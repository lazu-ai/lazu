openapi: 3.1.0
info:
  title: Lazu API
  version: 2.0.0
  contact:
    name: Lazu Support
    url: https://lazu.ai/docs
  description: |
    Lazu API 提供统一的 AI 模型接入服务，完全兼容 OpenAI API 格式。支持 GPT、Claude、Gemini 等主流模型，以及 Sora、Grok 视频生成。

    ## 认证方式
    所有 API 请求需要在 Header 中携带 API Key：
    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    ## 基础地址
    - 主地址：`https://api.lazu.ai`
servers:
  - url: "{scheme}://{host}"
    description: Lazu API server
    variables:
      scheme:
        default: https
      host:
        default: api.lazu.ai
security:
  - bearerAuth: []
tags:
  - name: Models
    description: 模型列表、模型目录与模型能力发现接口。
  - name: Files
    description: OpenAI-compatible file upload, listing, download, and deletion APIs.
  - name: Discovery
    description: Model discovery, catalog inspection, and pricing metadata.
  - name: Chat
    description: OpenAI-compatible chat completion APIs.
  - name: Anthropic
    description: Anthropic-native message format.
  - name: Gemini
    description: Gemini-native request format and discovery APIs.
  - name: Embeddings
    description: Embedding generation APIs.
  - name: Search
    description: Provider-neutral web and news search APIs backed by configured Lazu search backends.
  - name: Images
    description: Image generation APIs.
  - name: Videos
    description: Async video generation job APIs.
  - name: Responses
    description: OpenAI Responses-style inference APIs.
  - name: Decisions
    description: Non-streaming discriminative model evaluation.
  - name: Rerank
    description: Rerank APIs for retrieval workflows.
  - name: Audio
    description: Text-to-speech, speech-to-text, and audio translation.
  - name: Account
    description: Usage statistics, billing, and API key introspection.
paths:
  /api/status:
    get:
      tags:
        - Discovery
      summary: Get runtime and public status for frontend bootstrap.
      operationId: getStatus
      security: []
      responses:
        "200":
          description: Status payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
  /api/public/changelog:
    get:
      tags: [Discovery]
      summary: List published Docs changelog entries
      description: Returns localized announcements published to the Docs audience, newest first.
      operationId: listPublicChangelog
      security: []
      parameters:
        - name: locale
          in: query
          schema: { type: string, enum: [zh, en, zh-TW, ja] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          description: ID returned as next_before by the previous page.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Published changelog page.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, title, summary, body_markdown, api_changes, affected_models, published_at, locale]
                      properties:
                        id: { type: integer }
                        version: { type: string }
                        kind: { type: string }
                        title: { type: string }
                        summary: { type: string }
                        body_markdown: { type: string }
                        api_changes:
                          type: array
                          items:
                            type: object
                            required: [method, path, note]
                            properties:
                              method: { type: string }
                              path: { type: string }
                              note: { type: string }
                        affected_models:
                          type: array
                          items: { type: string }
                        published_at: { type: string, format: date-time }
                        locale: { type: string, enum: [zh, en, zh-TW, ja] }
                  next_before: { type: integer, minimum: 0 }
  /api/public/changelog.md:
    get:
      tags: [Discovery]
      summary: Get the published Docs changelog as Markdown
      operationId: getPublicChangelogMarkdown
      security: []
      parameters:
        - name: locale
          in: query
          schema: { type: string, enum: [zh, en, zh-TW, ja] }
      responses:
        "200":
          description: Localized Markdown changelog.
          content:
            text/markdown:
              schema: { type: string }
  /models.json:
    get:
      tags:
        - Models
      summary: Get the public static model catalog.
      description: |
        Returns the same public list-price model discovery payload as unauthenticated `/v1/models`.
        This endpoint never accepts personalized API-key pricing fields and is intended for CDN caching, crawlers, and agent discovery.
      operationId: getStaticModelCatalog
      security: []
      responses:
        "200":
          description: Public cacheable model catalog.
          headers:
            Cache-Control:
              description: Public cache policy for the static catalog.
              schema:
                type: string
            X-Lazu-Models-Source:
              description: Source live endpoint for the generated payload.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"
  /api/models/catalog:
    get:
      tags:
        - Models
      summary: 获取可用模型目录
      description: |
        返回当前 API Key 可访问的模型目录，适合在正式调用前先发现模型能力、支持端点、定价和示例请求。

        返回结果会按当前 API Key 自动过滤，并额外提供：
        - 输入/输出模态
        - 支持的端点类型
        - 可直接调用的接口路径
        - 定价信息
        - Usage/cache 上报维度与可计费维度
        - 参数提示
        - 可直接复制的 curl 示例
      operationId: listModelCatalog
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功返回当前 API Key 可用模型目录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"
              example:
                object: list
                data:
                  - id: claude-sonnet-4-20250514
                    owned_by: anthropic
                    description: Anthropic 平衡型模型，兼顾速度与效果
                    modality:
                      input:
                        - text
                        - image
                      output:
                        - text
                    supported_endpoint_types:
                      - openai
                      - anthropic
                    supported_endpoints:
                      - type: openai
                        path: /v1/chat/completions
                        method: POST
                      - type: anthropic
                        path: /v1/messages
                        method: POST
                    default_endpoint_type: openai
                    context_length: 200000
                    max_output_tokens: 8192
                    pricing:
                      currency: USD
                      billing_type: per_token
                      input_per_million: 3
                      output_per_million: 15
                    usage_capabilities:
                      reported_dimensions:
                        - input
                        - output
                        - cache_read
                        - cache_write
                        - cache_write_5m
                        - cache_write_1h
                      billable_dimensions:
                        - input
                        - output
                        - cache_read
                        - cache_write_5m
                        - cache_write_1h
                      response_fields:
                        openai_compatible:
                          - usage.prompt_tokens_details.cached_tokens
                          - usage.prompt_tokens_details.cache_write_tokens
                        request_detail:
                          - usage.dimensions
                          - billing.line_items
                    parameters:
                      max_tokens:
                        type: integer
                        description: 最大输出 token 数
                        default: 1024
                      temperature:
                        type: number
                        description: 采样温度
                        default: 0.7
                    example:
                      curl: >-
                        curl https://api.lazu.ai/v1/chat/completions -H
                        'Authorization: Bearer YOUR_API_KEY' -H 'Content-Type:
                        application/json' -d
                        '{"model":"claude-sonnet-4-20250514","messages":[{"role":"user","content":"你好，请用一句话介绍 Lazu"}]}'
                    tags:
                      - multimodal
                      - vision
                    open_source: false
        "401":
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Model catalog is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/pricing:
    get:
      tags:
        - Discovery
      summary: Get public pricing and marketplace metadata.
      description: |
        Public pricing view for enabled models. Use `/api/models/catalog` when you need token-scoped discovery for a specific API key.
      operationId: getPricing
      security: []
      responses:
        "200":
          description: Public pricing payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPricingResponse"
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models:
    get:
      tags:
        - Models
      summary: Discover available models.
      description: |
        Returns the rich model discovery catalog in an OpenAI-compatible `{object:"list",data:[...]}` envelope.
        Authentication is optional: without a key the response includes every public enabled model with list pricing; with a key the same items also include `your_price`, `accessible`, and top-level `your_pricing_context`.

        Use `include=health` to opt into best-effort runtime health fields. There is no `view` parameter; the default response is already rich.
      operationId: listModels
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: include
          in: query
          required: false
          description: Optional comma-separated enrichment list. Currently supports `health`.
          schema:
            type: string
            example: health
      responses:
        "200":
          description: Rich model discovery payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogResponse"
              example:
                object: list
                data:
                  - id: gpt-4o
                    object: model
                    created: 1698959748
                    name: gpt-4o
                    provider: openai
                    family: gpt
                    owned_by: openai
                    context_length: 128000
                    max_output_tokens: 16384
                    input_modalities:
                      - text
                      - image
                    output_modalities:
                      - text
                    capabilities:
                      supports_function_calling: true
                      supports_parallel_function_calling: true
                      supports_vision: true
                      supports_reasoning: false
                      supports_response_schema: true
                      supports_prompt_caching: true
                      supports_audio_input: false
                      supports_audio_output: false
                      supports_web_search: false
                      supports_pdf_input: false
                      supports_computer_use: false
                    pricing:
                      currency: USD
                      billing_type: per_token
                      input: 2.5
                      output: 10
                      cache_read: 1.25
                    supported_endpoint_types:
                      - openai
                    supported_parameters:
                      - tools
                      - tool_choice
                      - response_format
                    open_source: false
        "401":
          description: Invalid API key when one was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/models/{model}:
    get:
      tags:
        - Models
      summary: Discover one model.
      description: Returns the same rich catalog item shape as `/v1/models` for one model ID.
      operationId: retrieveModel
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: model
          in: path
          required: true
          description: 模型 ID
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: Optional comma-separated enrichment list. Currently supports `health`.
          schema:
            type: string
            example: health
      responses:
        "200":
          description: Rich model discovery item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCatalogItem"
              example:
                id: gpt-4o
                object: model
                created: 1698959748
                name: gpt-4o
                provider: openai
                family: gpt
                owned_by: openai
        "401":
          description: Invalid API key when one was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 模型不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/files:
    get:
      tags:
        - Files
      summary: List uploaded files.
      description: |
        Lists files uploaded by the current API key owner. Use `purpose` to filter by supported file purpose.
      operationId: listFiles
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: query
          required: false
          description: Optional purpose filter.
          schema:
            $ref: "#/components/schemas/FilePurpose"
        - name: limit
          in: query
          required: false
          description: Maximum number of files to return.
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 10000
        - name: order
          in: query
          required: false
          description: Sort by creation time.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        "200":
          description: File list payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
              example:
                object: list
                data:
                  - id: file-lazu-01HZY9Y7A7Q9Z8Y6X5W4V3T2S1
                    object: file
                    bytes: 18234
                    created_at: 1779525709
                    filename: invoice.png
                    purpose: vision
                    status: processed
        "400":
          description: Invalid purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Files
      summary: Upload a file.
      description: |
        Uploads a file for later retrieval or for `file_id` references in `/v1/responses` input items.

        Self-hosted deployments must configure `artifact_storage` with an S3-compatible service such as Cloudflare R2 or Amazon S3. Without object storage, this endpoint returns `503 storage_not_configured`.

        Supported purposes:
        - `user_data`: non-executable files up to 512 MiB
        - `vision`: PNG, JPEG, GIF, or WebP images up to 20 MiB
      operationId: uploadFile
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: Python
          label: openai SDK
          source: |
            from openai import OpenAI

            client = OpenAI(
                base_url="https://api.lazu.ai/v1",
                api_key="YOUR_LAZU_KEY",
            )

            with open("paper.pdf", "rb") as f:
                file = client.files.create(file=f, purpose="user_data")

            print(file.id)
        - lang: TypeScript
          label: openai SDK
          source: |
            import OpenAI from "openai";
            import fs from "node:fs";

            const client = new OpenAI({
              baseURL: "https://api.lazu.ai/v1",
              apiKey: process.env.LAZU_API_KEY,
            });

            const file = await client.files.create({
              file: fs.createReadStream("paper.pdf"),
              purpose: "user_data",
            });
            console.log(file.id);
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - purpose
                - file
              properties:
                purpose:
                  $ref: "#/components/schemas/FilePurpose"
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "201":
          description: Uploaded file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
              example:
                id: file-lazu-01HZY9Y7A7Q9Z8Y6X5W4V3T2S1
                object: file
                bytes: 18234
                created_at: 1779525709
                filename: invoice.png
                purpose: vision
                status: processed
        "400":
          description: Invalid request, purpose, or file type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The account's file storage is full (storage_quota_exceeded). Storage is free and capped at 10 GB per account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Uploaded file is too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Storage upload failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: File storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/files/{file_id}:
    get:
      tags:
        - Files
      summary: Retrieve file metadata.
      description: Returns metadata for a file owned by the current API key owner.
      operationId: retrieveFile
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: File identifier returned by `POST /v1/files`.
          schema:
            type: string
            example: file-lazu-01HZY9Y7A7Q9Z8Y6X5W4V3T2S1
      responses:
        "200":
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found or not accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Files
      summary: Delete a file.
      description: Deletes a file and its object-storage content, and returns its bytes to the account's storage allowance. Storage is not billed.
      operationId: deleteFile
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: File identifier returned by `POST /v1/files`.
          schema:
            type: string
            example: file-lazu-01HZY9Y7A7Q9Z8Y6X5W4V3T2S1
      responses:
        "200":
          description: File deletion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDeleteResponse"
              example:
                id: file-lazu-01HZY9Y7A7Q9Z8Y6X5W4V3T2S1
                object: file
                deleted: true
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found or not accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Storage delete failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: File storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/files/{file_id}/content:
    get:
      tags:
        - Files
      summary: Download file content.
      description: Downloads the raw file bytes for a file owned by the current API key owner.
      operationId: downloadFileContent
      security:
        - bearerAuth: []
      parameters:
        - name: file_id
          in: path
          required: true
          description: File identifier returned by `POST /v1/files`.
          schema:
            type: string
            example: file-lazu-01HZY9Y7A7Q9Z8Y6X5W4V3T2S1
      responses:
        "200":
          description: Raw file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found or not accessible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Storage read failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: File storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1beta/models:
    get:
      tags:
        - Gemini
      summary: List models in Gemini-compatible format.
      operationId: listGeminiModels
      security:
        - bearerAuth: []
        - geminiQueryKey: []
        - googleApiKeyHeader: []
      responses:
        "200":
          description: Gemini-compatible model list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiModelListResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/chat/completions:
    post:
      tags:
        - Chat
      summary: 创建对话补全
      description: 根据提供的消息列表生成模型响应。支持流式输出和多轮对话。
      operationId: createChatCompletion
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: Python
          label: openai SDK
          source: |
            from openai import OpenAI

            client = OpenAI(
                base_url="https://api.lazu.ai/v1",
                api_key="YOUR_LAZU_KEY",
            )

            resp = client.chat.completions.create(
                model="gpt-4o-mini",
                messages=[{"role": "user", "content": "Hello from Lazu"}],
            )
            print(resp.choices[0].message.content)
        - lang: TypeScript
          label: openai SDK
          source: |
            import OpenAI from "openai";

            const client = new OpenAI({
              baseURL: "https://api.lazu.ai/v1",
              apiKey: process.env.LAZU_API_KEY,
            });

            const resp = await client.chat.completions.create({
              model: "gpt-4o-mini",
              messages: [{ role: "user", content: "Hello from Lazu" }],
            });
            console.log(resp.choices[0].message.content);
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
            examples:
              simple:
                summary: 简单对话
                value:
                  model: gpt-4o-mini
                  messages:
                    - role: user
                      content: 你好，请介绍一下你自己
              with_system:
                summary: 带系统提示
                value:
                  model: gpt-4o
                  messages:
                    - role: system
                      content: 你是一个专业的编程助手
                    - role: user
                      content: 如何用 Python 读取 JSON 文件？
                  temperature: 0.7
                  max_tokens: 1000
              streaming:
                summary: 流式输出
                value:
                  model: claude-sonnet-4-20250514
                  messages:
                    - role: user
                      content: 写一首关于春天的诗
                  stream: true
      responses:
        "200":
          description: 成功返回对话补全结果
          headers:
            x-lazu-cost-usd:
              description: Actual charged cost for this inference response in USD, when usage was available.
              schema:
                type: string
            x-lazu-request-id:
              description: Lazu request ID for cost and log correlation.
              schema:
                type: string
            x-lazu-warning:
              description: Compatibility warning such as `stateless_bridge`; the standard response body is unchanged.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
              example:
                id: chatcmpl-lazu-01HZY9Y7A7Q9Z8Y6X5W4V3T2S1
                object: chat.completion
                created: 1702685778
                model: gpt-4o-mini
                choices:
                  - index: 0
                    message:
                      role: assistant
                      content: 你好！我是一个 AI 助手，很高兴为你服务。
                    finish_reason: stop
                usage:
                  prompt_tokens: 10
                  completion_tokens: 20
                  total_tokens: 30
                  cost: 0.000045
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 认证失败
          content:
