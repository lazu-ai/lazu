      responses:
        "200":
          description: Completion response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  object: { type: string, example: "text_completion" }
                  created: { type: integer }
                  model: { type: string }
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        index: { type: integer }
                        finish_reason: { type: string }
                  usage:
                    type: object
                    properties:
                      prompt_tokens: { type: integer }
                      completion_tokens: { type: integer }
                      total_tokens: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
  /api/usage/requests/{request_id}:
    get:
      tags: [Account]
      summary: Get request-level usage and billing detail
      description: |
        Returns the normalized usage dimensions, billing line items, provider cache fields, and routing metadata for one completed request.

        The endpoint is scoped to the bearer API key: a key can only read request records produced by the same token.
        Use the `X-Lazu-Request-Id` response header, error payload `request_id`, or gateway response request ID as `request_id`.
      operationId: getUsageRequestDetail
      security:
        - bearerAuth: []
      parameters:
        - name: request_id
          in: path
          required: true
          description: Lazu request ID returned by the inference API.
          schema:
            type: string
            example: req_lazu_01ABCDEF
      responses:
        "200":
          description: Request usage detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageRequestDetailResponse"
              example:
                object: usage.request
                id: req_lazu_01ABCDEF
                created_at: 1779878400
                model: claude-sonnet-4-20250514
                endpoint: /v1/chat/completions
                usage:
                  prompt_tokens: 1200
                  completion_tokens: 300
                  total_tokens: 1500
                  dimensions:
                    - name: input
                      quantity: 800
                      unit: token
                    - name: cache_read
                      quantity: 300
                      unit: token
                    - name: cache_write_5m
                      quantity: 100
                      unit: token
                    - name: output
                      quantity: 300
                      unit: token
                billing:
                  currency: USD
                  amount_microusd: 800
                  pricing_version: 3
                  line_items:
                    - dimension: input
                      quantity: 800
                      unit_microusd: 3000000
                      amount_microusd: 2400
        "401":
          description: Invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not found for the current API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: request not found
                  type: not_found_error
                  param: request_id
                  code: request_not_found
  /api/usage/summary:
    get:
      tags: [Account]
      summary: Current usage summary
      description: |
        Returns total spend, request count, and token count over a bounded
        time window for the current API key's owner. Totals and series are
        aggregated in SQL. Use for client-side dashboards and budget monitoring.
      operationId: getUsageSummary
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          description: Unix timestamp (seconds) — start of window. Default = 30 days ago. Explicit windows must be 366 days or less.
          schema: { type: integer }
        - name: until
          in: query
          description: Unix timestamp (seconds) — end of window. Default = now. Explicit windows must be 366 days or less.
          schema: { type: integer }
        - name: granularity
          in: query
          description: Bucket size for the time series in the response.
          schema:
            type: string
            enum: [hour, day, month]
            default: day
      responses:
        "200":
          description: Usage summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_microusd:
                    { type: integer, description: "Total spend in microUSD" }
                  total_requests: { type: integer }
                  total_tokens: { type: integer }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        bucket:
                          { type: string, description: "ISO 8601 timestamp" }
                        microusd: { type: integer }
                        requests: { type: integer }
                        tokens: { type: integer }
              example:
                total_microusd: 1245000
                total_requests: 318
                total_tokens: 412000
                series:
                  - {
                      bucket: "2026-05-23T00:00:00Z",
                      microusd: 412000,
                      requests: 105,
                      tokens: 138000,
                    }
                  - {
                      bucket: "2026-05-24T00:00:00Z",
                      microusd: 833000,
                      requests: 213,
                      tokens: 274000,
                    }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/token/inspect:
    get:
      tags: [Account]
      summary: Inspect the current API key
      description: |
        Returns metadata about the API key used to make this request —
        owner, scopes, remaining quota, tier, lane preferences. Useful when
        building dashboards that display "logged-in" state from the API key
        alone.
      operationId: inspectToken
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  name:
                    { type: string, description: "User-set label for this key" }
                  product:
                    {
                      type: string,
                      description: "Optional product or workload label for isolating keys",
                    }
                  metadata:
                    {
                      type: object,
                      additionalProperties: true,
                      description: "Optional JSON metadata attached to the key",
                    }
                  status:
                    {
                      type: integer,
                      description: "Stored key status. 1 = enabled, 2 = disabled, 3 = expired, 4 = exhausted. The console key projections (`/api/token/` list, search, detail, create, update) report `status` as a string instead; `status_code` always carries this number.",
                    }
                  status_code:
                    {
                      type: integer,
                      description: "Stored key status as a number, emitted on every projection that carries a status.",
                    }
                  rate_limits_enabled: { type: boolean }
                  rpm_limit:
                    {
                      type: integer,
                      description: "Per-key requests per minute. 0 inherits the account limit.",
                    }
                  tpm_limit:
                    {
                      type: integer,
                      description: "Per-key tokens per minute. 0 inherits the account limit.",
                    }
                  effective_rate_limits:
                    type: object
                    properties:
                      ceiling:
                        type: object
                        properties:
                          rpm: { type: integer }
                          tpm: { type: integer }
                      configured:
                        type: object
                        properties:
                          rpm: { type: integer }
                          tpm: { type: integer }
                      effective:
                        type: object
                        properties:
                          rpm: { type: integer }
                          tpm: { type: integer }
                      tpm_counting:
                        type: string
                        enum: [prompt_plus_max_output_times_completion_count]
                  group:
                    {
                      type: string,
                      description: "Lane the key routes on: direct (stable lane) or cheap (agent lane)",
                    }
                  remain_quota:
                    {
                      type: integer,
                      description: "Remaining balance in microUSD",
                    }
                  used_quota:
                    { type: integer, description: "Total spent in microUSD" }
                  unlimited_quota: { type: boolean }
                  expired_time:
                    { type: integer, description: "Unix timestamp; -1 = never" }
                  has_topped_up:
                    {
                      type: boolean,
                      description: "Account has completed at least one paid top-up",
                    }
                  vendor_groups:
                    type: object
                    additionalProperties:
                      { type: string, enum: [direct, cheap] }
                    description: "Per-vendor lane preference: direct (stable lane) or cheap (agent lane); empty means default (cheap)"
              example:
                id: 42
                name: "production-bot"
                product: "search-api"
                metadata: { environment: "production", cost_center: "search" }
                status: 1
                rate_limits_enabled: true
                rpm_limit: 120
                tpm_limit: 300000
                effective_rate_limits:
                  tier: "Tier2"
                  ceiling: { rpm: 300, tpm: 1000000 }
                  configured: { rpm: 120, tpm: 300000 }
                  effective: { rpm: 120, tpm: 300000 }
                  tpm_counting: "prompt_plus_max_output_times_completion_count"
                group: "Tier2"
                remain_quota: 12500000
                used_quota: 3850000
                unlimited_quota: false
                expired_time: -1
                has_topped_up: true
                vendor_groups:
                  {
                    "vendor_pub_openai": "direct",
                    "vendor_pub_anthropic": "cheap",
                  }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
    anthropicApiKey:
      type: apiKey
      in: header
      name: x-api-key
    googleApiKeyHeader:
      type: apiKey
      in: header
      name: x-goog-api-key
    geminiQueryKey:
      type: apiKey
      in: query
      name: key
  responses:
    BadRequest:
      description: Invalid request — bad parameters, malformed body, or upstream rejected the payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Invalid request body"
              type: "invalid_request_error"
              code: "bad_request_body"
    Unauthorized:
      description: API key missing, malformed, or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Invalid API key"
              type: "authentication_error"
              code: "invalid_api_key"
    Forbidden:
      description: Key disabled, IP not allow-listed, or insufficient quota.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Insufficient quota — top up to continue"
              type: "insufficient_quota"
              code: "insufficient_quota"
    NotFound:
      description: Resource not found — wrong model name, missing file_id, or path doesn't exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Model not found"
              type: "not_found_error"
              code: "model_not_found"
    PayloadTooLarge:
      description: Uploaded file exceeds the purpose's max size, or dereferenced files total exceed 64 MB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Uploaded file is too large"
              type: "invalid_request_error"
              code: "file_too_large"
    RateLimited:
      description: |
        A rate limit was reached. Honor the `Retry-After` header. The error
        code identifies the limiter: `request_rate_limit_exceeded` for account
        tier or success-request caps, `token_rate_limit_exceeded` for an
        individual key cap, and `total_request_rate_limit_exceeded` for the
        legacy total-request guard.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            tier:
              value:
                error:
                  message: "Request rate limit exceeded (60/min)"
                  type: "rate_limit_exceeded"
                  code: "request_rate_limit_exceeded"
            token:
              value:
                error:
                  message: "Token rate limit exceeded"
                  type: "rate_limit_exceeded"
                  code: "token_rate_limit_exceeded"
    UpstreamError:
      description: Upstream provider returned an error. `details.status_code` is the upstream HTTP status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: "Upstream returned status 502"
              type: "api_error"
              code: "upstream_error"
              details:
                channel_type: 1
                status_code: 502
  schemas:
    ApiEnvelope:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
        message:
          type: string
    ModelCatalogResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogItem"
        your_pricing_context:
          $ref: "#/components/schemas/ModelCatalogPricingContext"
    ModelCatalogItem:
      type: object
      required:
        - id
        - object
        - owned_by
        - modality
        - capabilities
        - supported_endpoint_types
        - pricing
        - usage_capabilities
        - example
      properties:
        id:
          type: string
          example: claude-sonnet-4-20250514
        request_model:
          type: string
          description: Model name to send to the listed endpoint when it differs from this catalog routing and pricing ID.
          example: gpt-6-luna
        object:
          type: string
          example: model
        created:
          type: integer
          format: int64
          example: 1626777600
        name:
          type: string
          example: claude-sonnet-4-20250514
        provider:
          type: string
          example: anthropic
        family:
          type: string
          example: claude
        owned_by:
          type: string
          example: anthropic
        description:
          type: string
        description_en:
          type: string
        description_zh:
          type: string
        modality:
          $ref: "#/components/schemas/ModelCatalogModality"
        input_modalities:
          type: array
          items:
            type: string
        output_modalities:
          type: array
          items:
            type: string
        capabilities:
          $ref: "#/components/schemas/ModelCatalogCapabilities"
        supported_endpoint_types:
          type: array
          items:
            type: string
            example: openai
        supported_endpoints:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogEndpoint"
        default_endpoint_type:
          type: string
          example: openai
        context_length:
          type: integer
          format: int64
        max_output_tokens:
          type: integer
          format: int64
        pricing:
          $ref: "#/components/schemas/ModelCatalogPricing"
        lanes:
          type: array
          items:
            $ref: "#/components/schemas/ModelCatalogLane"
        your_price:
          $ref: "#/components/schemas/ModelCatalogPricing"
        your_prices_by_group:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModelCatalogPricing"
        usage_capabilities:
          $ref: "#/components/schemas/ModelCatalogUsageCapabilities"
        accessible:
          type: boolean
          description: Present only when authenticated; true when the supplied API key may call the model.
        supported_parameters:
          type: array
          items:
            type: string
        released_at:
          type: integer
          format: int64
        deprecation_date:
          type: string
        is_new:
          type: boolean
        is_featured:
          type: boolean
        popularity:
          type: number
          format: double
        health:
          $ref: "#/components/schemas/ModelCatalogHealth"
        parameters:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CatalogParam"
        example:
          $ref: "#/components/schemas/ModelCatalogExample"
        tags:
          type: array
          items:
            type: string
        open_source:
          type: boolean
    ModelCatalogCapabilities:
      type: object
      required:
        - supports_function_calling
        - supports_parallel_function_calling
        - supports_vision
        - supports_reasoning
        - supports_response_schema
        - supports_prompt_caching
        - supports_audio_input
        - supports_audio_output
        - supports_web_search
        - supports_pdf_input
        - supports_computer_use
      properties:
        supports_function_calling:
          type: boolean
        supports_parallel_function_calling:
          type: boolean
        supports_vision:
          type: boolean
        supports_reasoning:
          type: boolean
        supports_response_schema:
          type: boolean
        supports_prompt_caching:
          type: boolean
        supports_audio_input:
          type: boolean
        supports_audio_output:
          type: boolean
        supports_web_search:
          type: boolean
        supports_pdf_input:
          type: boolean
        supports_computer_use:
          type: boolean
    ModelCatalogPricingContext:
      type: object
      properties:
        group:
          type: string
        tier:
          type: string
        discount_factor:
          type: number
          format: double
    ModelCatalogHealth:
      type: object
      description: Best-effort runtime health, present only when `include=health`.
      properties:
        status:
          type: string
          enum:
            - available
            - degraded
            - unavailable
            - unknown
        latency_p50_ms:
          type: integer
        latency_p95_ms:
          type: integer
        availability:
          type: number
          format: double
          minimum: 0
          maximum: 1
        output_tps:
          type: number
          format: double
        observed_window:
          type: string
          enum:
            - traffic
            - probe
            - none
        bucket_seconds:
          type: integer
          format: int64
          description: Duration represented by each model-plaza history bucket (7200, two hours).
        buckets:
          type: array
          description: Lane-level 7-day history (84 two-hour buckets) without upstream channel identities.
          items:
            $ref: "#/components/schemas/ModelCatalogHealthBucket"
    ModelCatalogHealthBucket:
      type: object
      required:
        - index
        - start_at
        - source
        - tone
      properties:
        index:
          type: integer
        start_at:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - traffic
            - probe
            - none
        success_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
        tone:
          type: string
          enum:
            - ok
            - warn
            - bad
            - none
    ModelCatalogModality:
      type: object
      required:
        - input
        - output
      properties:
        input:
          type: array
          items:
            type: string
        output:
          type: array
          items:
            type: string
    ModelCatalogEndpoint:
      type: object
      required:
        - type
        - path
      properties:
        type:
          type: string
          example: openai
        path:
          type: string
          example: /v1/chat/completions
        method:
          type: string
          example: POST
        mode:
          type: string
          enum: [native, bridged]
          description: Whether an accessible route serves this endpoint natively or through a lossless protocol bridge.
    ImagePricing:
      type: object
      description: USD per successful image. Pixel tiers use each returned image size; decomposition includes the base image. References are charged only on successful requests.
      required: [output_usd]
      properties:
        output_usd:
          type: number
          exclusiveMinimum: 0
        pixel_threshold:
          type: integer
          minimum: 0
          example: 2610000
        high_resolution_output_usd:
          type: number
          minimum: 0
        layer_usd:
          type: number
          minimum: 0
        high_resolution_layer_usd:
          type: number
          minimum: 0
        reference_usd:
          type: number
          minimum: 0
        free_references:
          type: integer
          minimum: 0
          maximum: 14
    ModelCatalogPricing:
      type: object
      required:
        - currency
      properties:
        image_pricing:
          $ref: "#/components/schemas/ImagePricing"
        currency:
          type: string
          example: USD
        billing_type:
          type: string
          example: per_token
        input:
          type: number
          format: double
          description: List or personalized input price in USD per million tokens.
        output:
          type: number
          format: double
          description: List or personalized output price in USD per million tokens.
        cache_read:
          type: number
          format: double
          description: Cached input read price in USD per million tokens.
        cache_write_5m:
          type: number
          format: double
          description: Cache creation price for 5-minute TTL in USD per million tokens.
        cache_write_1h:
          type: number
          format: double
          description: Cache creation price for 1-hour TTL in USD per million tokens.
        audio_input:
          type: number
          format: double
          description: Audio input price in USD per million tokens.
        audio_output:
          type: number
          format: double
          description: Audio output price in USD per million tokens.
        image_input:
          type: number
          format: double
          description: Image input price in USD per million tokens.
        image_output:
          type: number
          format: double
          description: Image output price in USD per million tokens.
        peak_hours_utc:
          type: string
          description: Comma-separated UTC hour ranges during which peak_multiplier applies.
        peak_multiplier:
          type: number
          format: double
          description: Multiplier applied to every price dimension during peak_hours_utc.
        request:
          type: number
          format: double
          description: Per-request price in USD for per-call models.
        second:
          type: number
          format: double
          description: Per-second price in USD for media/video generation models.
        input_per_million:
          type: number
          format: double
          deprecated: true
        output_per_million:
          type: number
          format: double
          deprecated: true
        cache_read_per_million:
          type: number
          format: double
          deprecated: true
        cache_write_5m_per_million:
          type: number
          format: double
          deprecated: true
        cache_write_1h_per_million:
          type: number
          format: double
          deprecated: true
        request_price:
          type: number
          format: double
          deprecated: true
        second_price:
          type: number
          format: double
          deprecated: true
        pricing_version:
          type: integer
          format: int64
        updated_at:
          type: string
    ModelCatalogLane:
      type: object
      required:
        - key
        - available
        - pricing
      properties:
        key:
          type: string
          description: Customer-facing lane key. `stable` is the stable lane; `eco` is the agent lane.
          enum:
            - stable
            - eco
        available:
          type: boolean
          description: Whether an enabled routing group can currently serve this lane.
        pricing:
          $ref: "#/components/schemas/ModelCatalogPricing"
        your_price:
          $ref: "#/components/schemas/ModelCatalogPricing"
        health:
          $ref: "#/components/schemas/ModelCatalogHealth"
    ModelCatalogUsageCapabilities:
      type: object
      required:
        - reported_dimensions
        - billable_dimensions
      properties:
        reported_dimensions:
          type: array
          description: Usage dimensions that Lazu can normalize for this model family when upstream reports them.
          items:
            $ref: "#/components/schemas/UsageDimensionName"
          example:
            - input
            - output
            - cache_read
            - cache_write
            - cache_miss
        billable_dimensions:
          type: array
          description: Dimensions with configured prices for the current catalog price context.
          items:
            $ref: "#/components/schemas/UsageDimensionName"
          example:
            - input
            - output
            - cache_read
        response_fields:
          type: object
          description: Field paths clients can inspect in compatible responses, request detail, or native provider payloads.
          additionalProperties:
            type: array
            items:
              type: string
    CatalogParam:
      type: object
      properties:
        type:
          type: string
        description:
          type: string
        default: {}
        required:
          type: boolean
        range:
          type: array
          items:
            type: number
            format: double
        enum:
          type: array
          items:
            type: string
    ModelCatalogExample:
      type: object
      properties:
        curl:
          type: string
    UsageDimensionName:
      type: string
      enum:
        - input
        - output
        - cache_read
        - cache_write
        - cache_write_5m
        - cache_write_1h
        - cache_miss
        - audio_input
        - audio_output
        - image_input
        - image_output
        - request
        - second
        - web_search
        - claude_web_search
        - file_search
        - image_generation_call
        - audio_input_separate
    UsageDimension:
      type: object
      required:
        - name
        - quantity
        - unit
      properties:
        name:
          $ref: "#/components/schemas/UsageDimensionName"
        quantity:
          type: integer
          format: int64
        unit:
          type: string
          enum:
            - token
            - request
            - second
    UsageRequestDetailResponse:
      type: object
      required:
        - object
        - id
        - created_at
        - model
        - usage
        - billing
      properties:
        object:
          type: string
          enum:
            - usage.request
        id:
          type: string
        created_at:
          type: integer
          format: int64
        model:
          type: string
        endpoint:
          type: string
          example: /v1/chat/completions
        usage:
          $ref: "#/components/schemas/UsageRequestUsage"
        billing:
          $ref: "#/components/schemas/UsageRequestBilling"
        routing:
          $ref: "#/components/schemas/UsageRequestRouting"
        log_id:
          type: string
    UsageRequestUsage:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
        - dimensions
      properties:
        images:
          type: object
          description: Successful image facts used by image billing; also retained for asynchronous reconciliation.
          properties:
            input_images:
              type: integer
            outputs:
              type: array
              items:
                type: object
                properties:
                  pixels:
                    type: integer
                  layer:
                    type: boolean

        measurement:
          type: object
          description: Optional token provenance for new text usage facts. Missing on historical or unclassified facts; unrelated to request origin.
          required: [input, output]
          properties:
            input:
              type: string
              enum: [provider, local_estimate, unavailable]
            output:
              type: string
              enum: [provider, local_estimate, unavailable]
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/UsageDimension"
    UsageRequestBilling:
      type: object
      required:
        - currency
        - amount_microusd
      properties:
        currency:
          type: string
          example: USD
        amount_microusd:
          type: integer
          format: int64
        pricing_version:
          type: integer
          format: int64
        line_items:
          type: array
          items:
            $ref: "#/components/schemas/BillingLineItem"
        missing_price_dimensions:
          type: array
          items:
            type: string
        context_tier:
          description: Present when the request's input tokens (cache reads and writes included) passed the model's long-context threshold; every line is then billed at the long-context prices.
          type: object
          required:
            - threshold
            - input_tokens
          properties:
            threshold:
              type: integer
              format: int64
            input_tokens:
              type: integer
              format: int64
        peak:
          description: Present when the request was billed inside the model's peak hours; unit prices already include the multiplier.
          type: object
          required:
            - multiplier
          properties:
            multiplier:
              type: number
        discount:
          description: Whole-order discount applied to the subtotal.
          type: object
          required:
            - pct
            - amount_microusd
          properties:
            pct:
              type: number
            amount_microusd:
              type: integer
              format: int64
    BillingLineItem:
      type: object
      required:
        - dimension
        - quantity
        - unit_microusd
        - amount_microusd
      properties:
        dimension:
          type: string
        quantity:
          type: integer
          format: int64
        unit_microusd:
          type: integer
          format: int64
        amount_microusd:
          type: integer
          format: int64
    UsageRequestRouting:
      type: object
      description: Public request timing only; internal routing and provider identities are not exposed.
      additionalProperties: false
      properties:
        status_code:
          type: integer
        total_duration_ms:
          type: integer
        ttft_ms:
          type: integer
        was_streaming:
          type: boolean
    UsageRequestProviderUsage:
      type: object
      properties:
