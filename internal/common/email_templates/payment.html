<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark">
<style>
@media only screen and (max-width:600px){.payment-shell{width:100%!important}.payment-head{padding:36px 28px 44px!important}.payment-body{padding:36px 28px 40px!important}.payment-hero{font-size:88px!important}.payment-hero-compact{font-size:56px!important}.payment-logo{width:74px!important;height:26px!important}.payment-eyebrow{font-size:10px!important}.payment-spacer{height:72px!important}.payment-fact{display:block!important;width:100%!important;padding:12px 0!important;border-bottom:1px solid #e5e5e3!important}.payment-actions{width:100%!important}.payment-action{display:block!important;width:100%!important;box-sizing:border-box!important}.payment-secondary{display:block!important;padding:20px 0 0!important}.payment-footer{padding:12px 8px 0!important}}
@media (prefers-color-scheme:dark){body,.payment-ground{background:#171718!important}.payment-head,.payment-action{background:#2c2c2f!important}.payment-body{background:#232325!important;border-color:#414145!important}.payment-hero{color:#f1f1f2!important}.payment-copy,.payment-fact-value{color:#f1f1f2!important}.payment-muted,.payment-fact-label,.payment-footer{color:#a4a4a7!important}.payment-action{background:#f1f1f2!important}.payment-action-link{color:#1a1a1b!important}.payment-secondary a,.payment-footer a{color:#9fb6f7!important}}
</style>
</head>
<body style="margin:0;padding:0;background:#f2f2ef;">
<span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;">{{.Preheader}}</span>
<table role="presentation" class="payment-ground" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f2f2ef" style="background:#f2f2ef;"><tr><td align="center" style="padding:32px 16px 40px;">
<table role="presentation" class="payment-shell" width="640" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:640px;border-collapse:separate;">
<tr><td class="payment-head" bgcolor="#202329" style="background:#202329;padding:56px 64px 72px;border-radius:16px 16px 0 0;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr>
<td valign="middle" style="width:50%;">{{if .LogoURL}}<img class="payment-logo" src="{{.LogoURL}}" alt="Lazu" width="85" height="30" style="display:block;width:85px;height:30px;border:0;">{{else}}<strong style="font-family:Arial,sans-serif;font-size:25px;color:#fbfaf7;">Lazu</strong>{{end}}</td>
<td class="payment-eyebrow" valign="middle" align="right" style="font:11px/1.3 'IBM Plex Mono','Courier New',monospace;letter-spacing:0.16em;color:#b5b5b5;">{{.Eyebrow}}</td>
</tr></table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td class="payment-spacer" height="112" style="height:112px;font-size:1px;line-height:1px;">&nbsp;</td></tr></table>
<div class="payment-hero{{if .CompactHero}} payment-hero-compact{{end}}" style="font:400 {{if .CompactHero}}88px{{else}}120px{{end}}/0.95 Georgia,'Times New Roman',serif;letter-spacing:-0.01em;color:#fbfaf7;word-wrap:break-word;">{{.Hero}}</div>
<div class="payment-copy" style="padding-top:20px;font:17px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#c5c5c5;">{{.Message}}</div>
</td></tr>
<tr><td class="payment-body" bgcolor="#fdfdfc" style="background:#fdfdfc;padding:56px 64px 64px;border:1px solid #e5e5e3;border-top:0;border-radius:0 0 16px 16px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr>{{range .Facts}}
<td class="payment-fact" valign="top" style="width:25%;padding:0 12px 0 0;word-break:break-word;">
<div class="payment-fact-label" style="font:12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#696d75;">{{.Label}}</div>
<div class="payment-fact-value" style="padding-top:6px;font:{{if .Mono}}13px/1.5 'IBM Plex Mono','Courier New',monospace{{else}}15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif{{end}};color:#22242a;">{{.Value}}</div>
</td>{{end}}</tr></table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td height="48" style="height:48px;font-size:1px;line-height:1px;">&nbsp;</td></tr><tr><td height="1" bgcolor="#e5e5e3" style="height:1px;font-size:1px;line-height:1px;">&nbsp;</td></tr><tr><td height="32" style="height:32px;font-size:1px;line-height:1px;">&nbsp;</td></tr></table>
<table role="presentation" class="payment-actions" cellspacing="0" cellpadding="0" border="0"><tr><td class="payment-action" align="center" bgcolor="#202329" style="background:#202329;border-radius:10px;height:48px;">
<a class="payment-action-link" href="{{.ActionURL}}" style="display:block;padding:14px 26px;font:500 15px/20px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#f2f3f5;text-decoration:none;">{{.ActionLabel}}</a>
</td>{{if .LinkURL}}<td class="payment-secondary" style="padding-left:32px;"><a href="{{.LinkURL}}" style="font:500 15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#4a66bd;text-decoration:none;">{{.LinkLabel}} →</a></td>{{end}}</tr></table>
</td></tr>
<tr><td class="payment-footer" style="padding:20px 8px 0;"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr>
<td style="font:12px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#696d75;">Lazu.ai</td>
<td align="right" style="font:12px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;"><a href="mailto:support@lazu.ai" style="color:#5f646d;text-decoration:none;">Contact support</a></td>
</tr></table></td></tr>
</table></td></tr></table>
</body></html>
